server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    default_type application/octet-stream;

    location = /apps.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
}

